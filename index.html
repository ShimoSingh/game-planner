<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Game Planner</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Game Planner</h1>
        <div class="row">
            <div class="col-md-6">
                <h2>Player List</h2>
                <ul id="player-list" class="list-group">
                    <!-- Player items will be added here -->
                </ul>
                <div id="player-list-info" class="bg-secondary-subtle rounded text-center py-4 my-2 px-2">
                    Add atleast 4 players to generate matches.
                </div>
            </div>
            <div class="col-md-6">
                <h2 class="mt-4 mt-md-0">Add a Player</h2>
                <form id="player-form">
                    <div class="mb-3">
                        <label for="player-name" class="form-label">Player Name</label>
                        <input type="text" class="form-control" id="player-name" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Player</button>
                    <button type="reset" class="btn btn-secondary">Clear All</button>
                </form>
                <h2 class="mt-4">Matches</h2>
                <div id="matches-list">
                    <ul id="saved-matches-list" class="list-group mb-4">
                    </ul>
                </div>
                <form id="generate-matches-form">
                    <div class="mb-3">
                        <label for="num-rounds" class="form-label">Number of Rounds</label>
                        <input type="number" class="form-control" id="num-rounds" min="1" required>
                    </div>
                </form>
                <button id="generate-matches" class="btn btn-success">Generate Matches</button>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-md-12 js-generated-games-container d-none">
                <h2 class="my-4 text-center">Generated Matches</h2>
                <ul id="games-list" class="list-group overflow-hidden">
                    <!-- Generated matches will be added here -->
                </ul>
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-primary" id="download-button">Download</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="players.js"></script>
    <script src="game-computer.js"></script>
    <script src="index.js"></script>
    <style>
        @media print {
            body {
                visibility: hidden;
            }
            #games-list {
                visibility: visible;
                position: absolute;
                width: 100%;
                left: 0;
                top: 0;
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</body>
</html>
